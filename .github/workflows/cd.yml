name: CD
# Deploys the website whenever changes are merged to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    name: Checks

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      checks: read # Required for lewagon/wait-on-check-action

    steps:
      - name: Wait for checks to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.ref }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: Checks
          ignore-checks: Dependabot

  deploy:
    name: Deploy

    needs: checks

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.WEBSITE_URL }}

    permissions:
      contents: read # Required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Build
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          ping: ${{ secrets.SCP_HOST }}

      - name: Deploy
        env:
          HOST: ${{ secrets.SCP_HOST }}
          USERNAME: ${{ secrets.SCP_USERNAME }}
          TARGET: ${{ secrets.SCP_TARGET }}
          RSYNC_RSH: ssh -o StrictHostKeyChecking=accept-new
        run: rsync -az --delete dist/ "$USERNAME@$HOST:${TARGET:?}/"
